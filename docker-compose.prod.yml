services:
  payload:
    build: .
    image: elegardens:latest
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - media_data:/app/media

  postgres:
    restart: always
    image: postgres:17.6
    environment:
      - POSTGRES_USER=payload
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=elegardens
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d elegardens']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata_prod:
  media_data:
